<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio & CV</title>
  <!-- ============================================================
  GitHub Pages SPA fix — must run BEFORE the app's module script
  below, so window.location is already restored to the real path
  by the time React (and the router) reads it.
  Works together with 404.html which redirects unknown paths
  back to index with ?p=<encoded-path>.
  ============================================================ -->
  <script>
    (function () {
      var query = window.location.search;
      if (query.startsWith('?p=')) {
        var restored = decodeURIComponent(query.slice(3));
        // Restore the real URL without triggering a page reload
        window.history.replaceState(
          null, null,
          window.location.pathname.split('/').slice(0, 2).join('/') +
          '/' + restored
        );
      }
    })();
  </script>
  <script type="module" crossorigin src="/Portfolio/assets/main-hDwxf70y.js"></script>
  <link rel="stylesheet" crossorigin href="/Portfolio/assets/main-5Z8qPCiC.css">
</head>

<body>
  <div id="root"></div>
</body>

</html>
